<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/png" href="./onnx-fav.png" />
    <link rel="apple-touch-icon" href="./pwa-192.png" />
    <title>Model Explorer ONNX</title>
  </head>
  <body>
    <main id="app">
      <aside id="left-panel" class="model-list">
        <div class="side-header">
          <button
            id="sidebar-toggle"
            class="ghost-btn"
            title="Collapse models panel"
            aria-label="Collapse models panel"
            aria-controls="left-panel"
          >
            <i data-lucide="panel-left-close"></i>
          </button>
          <div class="side-title">
            <span>Models</span>
          </div>
          <div class="side-header-actions">
            <button
              id="add-files-btn"
              class="ghost-btn"
              type="button"
              title="Open model files"
            >
              <i data-lucide="plus"></i>
              Open files
            </button>
            <button
              id="debug-toggle"
              class="ghost-btn"
              title="Toggle debug logs"
              aria-label="Toggle debug logs"
            >
              <i data-lucide="terminal-square"></i>
            </button>
          </div>
          <input
            id="model-file"
            class="hidden-file-input"
            type="file"
            multiple
            accept=".onnx,.onnxtxt,.onnxtext,.textproto,.json,.onnxjson"
          />
        </div>
        <div class="url-loader">
          <input id="model-url-input" type="url" aria-label="Model URL" placeholder="Load model from URL" />
          <button
            id="load-url-btn"
            class="ghost-btn"
            title="Load URL model"
            aria-label="Load model from URL"
          >
            Load
          </button>
        </div>
        <div id="ui-status" class="ui-status hidden" aria-live="polite"></div>
        <div id="model-list"></div>
        <button
          id="copy-share-btn"
          class="ghost-btn hidden"
          title="Copy a link to all URL-loaded models"
        >
          <i data-lucide="share-2"></i>
          Copy models link
        </button>
        <pre id="debug-log" class="debug-log hidden"></pre>
      </aside>
      <section id="viewer-shell" class="viewer-shell"></section>
      <button
        id="sidebar-fab"
        class="sidebar-fab hidden"
        aria-controls="left-panel"
        title="Open models panel"
        aria-label="Open models panel"
      >
        <i data-lucide="folder-open"></i>
        Models
      </button>
    </main>
    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-overlay-card">
        <i data-lucide="upload-cloud"></i>
        <span>Drop ONNX files anywhere to load</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
